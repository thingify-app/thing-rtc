<!doctype html>
<html>
    <head>
        <title>ThingRTC</title>
        <link rel="stylesheet" href="app.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/> 
    </head>
    <body>
        <div class="box">
            <h1>Peer Setup</h1>
            <p>Local public key:</p>
            <div id="localPublicKey"></div>
            <button id="resetLocalKeyButton">Reset local key</button>
            <p>Role:</p>
            <input type="radio" id="initiator" name="role" checked/>
            <label for="initiator">Initiator</label>
            <input type="radio" id="responder" name="role"/>
            <label for="responder">Responder</label>
            <p>Peer keys:</p>
            <input type="text" id="peerPublicKey" placeholder="Peer public key"/>
            <button id="addPeerPublicKey">Add</button>
            <div id="remoteKeysList"></div>
            <button id="deletePeerPublicKey">Delete key</button>
        </div>
        <div class="box">
            <h1>Connection</h1>
            <p>Send video:</p>
            <p><input type="checkbox" id="sendVideo"/></p>
            <p><button id="connectButton">Connect</button></p>
            <p><button id="disconnectButton">Disconnect</button></p>
            <p>Data channels:</p>
            <p>
                <div id="dataChannelList"></div> 
                <input type="text" id="dataChannelLabel"/>
                <button id="createDataChannelButton">Create data channel</button>
            </p>
            <p>Message:</p>
            <p>
                <input type="text" id="message"/>
                <button id="sendMessageButton">Send</button>
            </p>
            <p>Speed test:</p>
            <p>
                <button id="startSpeedTestButton">Start speed test</button>
                <button id="stopSpeedTestButton">Stop speed test</button>
                <div id="receivedBytes"></div>
                <div id="sentBytes"></div>
            </p>
            <p>Local video:</p>
            <p><video id="localVideo" autoplay playsinline></video></p>
            <p>Remote video:</p>
            <p><video id="remoteVideo" autoplay playsinline></video></p>
        </div>
        <script src="./app.ts"></script>
    </body>
</html>
